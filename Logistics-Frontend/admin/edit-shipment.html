<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Shipment | Logistics Platform</title>

    <link rel="stylesheet"
          href="../css/admin.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #f1f5f9;

            font-family: Arial, sans-serif;

            color: #0f172a;

        }

        .page-content {

            padding: 35px;

            min-height: 100vh;

        }

        .page-header {

            margin-bottom: 25px;

        }

        .page-header h1 {

            margin: 0;

            font-size: 30px;

            color: #0f172a;

        }

        .page-header p {

            margin-top: 8px;

            color: #64748b;

            font-size: 15px;

        }

        .form-card {

            background: white;

            border-radius: 16px;

            padding: 35px;

            max-width: 850px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.07);

        }

        .form-title {

            margin-top: 0;

            margin-bottom: 30px;

            font-size: 21px;

            color: #1e293b;

        }

        .field-wrapper {

            margin-bottom: 22px;

        }

        .field-wrapper label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;

        }

        .field-wrapper input,
        .field-wrapper select {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 14px;

            background: white;

            color: #0f172a;

            outline: none;

        }

        .field-wrapper input:focus,
        .field-wrapper select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(
                    37,
                    99,
                    235,
                    0.10
                );

        }

        .field-wrapper input:disabled {

            background: #f8fafc;

            color: #64748b;

            cursor: not-allowed;

        }

        .help-text {

            display: block;

            margin-top: 6px;

            font-size: 12px;

            color: #64748b;

        }

        .button-area {

            display: flex;

            gap: 12px;

            margin-top: 30px;

        }

        .update-btn {

            border: none;

            background: #2563eb;

            color: white;

            padding: 13px 24px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

        }

        .update-btn:hover {

            background: #1d4ed8;

        }

        .update-btn:disabled {

            background: #94a3b8;

            cursor: not-allowed;

        }

        .cancel-btn {

            border: none;

            background: #e2e8f0;

            color: #334155;

            padding: 13px 24px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

        }

        .cancel-btn:hover {

            background: #cbd5e1;

        }

        .message {

            display: none;

            margin-top: 22px;

            padding: 14px 16px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 500;

        }

        .success-message {

            display: block;

            background: #dcfce7;

            color: #166534;

            border: 1px solid #bbf7d0;

        }

        .error-message {

            display: block;

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;

        }

        .loading {

            text-align: center;

            padding: 30px;

            color: #64748b;

        }

        @media (max-width: 700px) {

            .page-content {

                padding: 20px;

            }

            .form-card {

                padding: 22px;

            }

        }

    </style>

</head>


<body>


<div class="page-content">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="page-header">

        <h1>
            Edit Shipment
        </h1>

        <p>
            Update shipment information.
        </p>

    </div>


    <!-- =========================================
         FORM CARD
    ========================================== -->

    <div class="form-card">


        <h2 class="form-title">
            Shipment Information
        </h2>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading">

            Loading shipment information...

        </div>


        <!-- FORM -->

        <form
            id="editShipmentForm"
            style="display:none;">


            <!-- CUSTOMER ID -->

            <div class="field-wrapper">

                <label for="customerId">
                    Customer ID
                </label>

                <input
                    type="number"
                    id="customerId"
                    min="1"
                    required
                >

                <span class="help-text">
                    Customer associated with this shipment.
                </span>

            </div>


            <!-- TRACKING NUMBER -->

            <div class="field-wrapper">

                <label for="trackingNumber">
                    Tracking Number
                </label>

                <input
                    type="text"
                    id="trackingNumber"
                    required
                >

                <span class="help-text">
                    Tracking number should remain unique.
                </span>

            </div>


            <!-- ORIGIN -->

            <div class="field-wrapper">

                <label for="origin">
                    Origin
                </label>

                <input
                    type="text"
                    id="origin"
                    required
                >

            </div>


            <!-- DESTINATION -->

            <div class="field-wrapper">

                <label for="destination">
                    Destination
                </label>

                <input
                    type="text"
                    id="destination"
                    required
                >

            </div>


            <!-- SHIPMENT DATE -->

            <div class="field-wrapper">

                <label for="shipmentDate">
                    Shipment Date
                </label>

                <input
                    type="date"
                    id="shipmentDate"
                    required
                >

            </div>


            <!-- EXPECTED DELIVERY -->

            <div class="field-wrapper">

                <label for="expectedDeliveryDate">
                    Expected Delivery Date
                </label>

                <input
                    type="date"
                    id="expectedDeliveryDate"
                    required
                >

            </div>


            <!-- STATUS -->

            <div class="field-wrapper">

                <label for="status">
                    Shipment Status
                </label>

                <select
                    id="status"
                    required>

                    <option value="In Transit">
                        In Transit
                    </option>

                    <option value="Delivered">
                        Delivered
                    </option>

                    <option value="Delayed">
                        Delayed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="button-area">

                <button
                    type="submit"
                    id="updateButton"
                    class="update-btn">

                    Update Shipment

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    onclick="goBack()">

                    Cancel

                </button>

            </div>


        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


    </div>


</div>


<script>


    // =========================================
    // BACKEND URL
    // =========================================

    const API_BASE_URL =
        "http://127.0.0.1:8080";


    // =========================================
    // GET SHIPMENT ID FROM URL
    // =========================================

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const shipmentId =
        urlParams.get(
            "shipmentId"
        );


    // =========================================
    // LOAD EXISTING SHIPMENT
    // =========================================

    async function loadShipment() {


        const loading =
            document.getElementById(
                "loading"
            );


        const form =
            document.getElementById(
                "editShipmentForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        if (!shipmentId) {

            loading.style.display =
                "none";

            message.className =
                "message error-message";

            message.textContent =
                "No shipment ID was provided.";

            message.style.display =
                "block";

            return;

        }


        try {


            const response =
                await fetch(

                    API_BASE_URL +
                    "/api/shipments/" +
                    shipmentId,

                    {

                        method: "GET",

                        credentials: "include"

                    }

                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load shipment. HTTP status: "
                    +
                    response.status
                );

            }


            const shipment =
                await response.json();


            console.log(
                "Shipment loaded for editing:",
                shipment
            );


            // =================================
            // FILL FORM
            // =================================

            document
                .getElementById(
                    "customerId"
                )
                .value =
                    shipment.customerId
                    ?? "";


            document
                .getElementById(
                    "trackingNumber"
                )
                .value =
                    shipment.trackingNumber
                    ?? "";


            document
                .getElementById(
                    "origin"
                )
                .value =
                    shipment.origin
                    ?? "";


            document
                .getElementById(
                    "destination"
                )
                .value =
                    shipment.destination
                    ?? "";


            document
                .getElementById(
                    "shipmentDate"
                )
                .value =
                    shipment.shipmentDate
                    ?? "";


            document
                .getElementById(
                    "expectedDeliveryDate"
                )
                .value =
                    shipment.expectedDeliveryDate
                    ?? "";


            document
                .getElementById(
                    "status"
                )
                .value =
                    shipment.status
                    ?? "In Transit";


            // =================================
            // SHOW FORM
            // =================================

            loading.style.display =
                "none";

            form.style.display =
                "block";


        }

        catch (error) {


            console.error(
                "Load shipment error:",
                error
            );


            loading.style.display =
                "none";


            message.className =
                "message error-message";


            message.textContent =
                error.message
                ||
                "Unable to load shipment.";


            message.style.display =
                "block";

        }

    }


    // =========================================
    // UPDATE SHIPMENT
    // =========================================

    document
        .getElementById(
            "editShipmentForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    document.getElementById(
                        "message"
                    );


                const updateButton =
                    document.getElementById(
                        "updateButton"
                    );


                const shipmentData = {

                    customerId:
                        Number(
                            document.getElementById(
                                "customerId"
                            ).value
                        ),

                    trackingNumber:
                        document.getElementById(
                            "trackingNumber"
                        )
                        .value
                        .trim(),

                    origin:
                        document.getElementById(
                            "origin"
                        )
                        .value
                        .trim(),

                    destination:
                        document.getElementById(
                            "destination"
                        )
                        .value
                        .trim(),

                    shipmentDate:
                        document.getElementById(
                            "shipmentDate"
                        ).value,

                    expectedDeliveryDate:
                        document.getElementById(
                            "expectedDeliveryDate"
                        ).value,

                    status:
                        document.getElementById(
                            "status"
                        ).value

                };


                console.log(
                    "Updating shipment:",
                    shipmentData
                );


                updateButton.disabled =
                    true;


                updateButton.textContent =
                    "Updating...";


                message.style.display =
                    "none";


                try {


                    const response =
                        await fetch(

                            API_BASE_URL +
                            "/api/shipments/" +
                            shipmentId,

                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                credentials:
                                    "include",

                                body:
                                    JSON.stringify(
                                        shipmentData
                                    )

                            }

                        );


                    let result = {};


                    try {

                        result =
                            await response.json();

                    }

                    catch (jsonError) {

                        result = {};

                    }


                    console.log(
                        "Update response:",
                        result
                    );


                    if (!response.ok) {

                        throw new Error(

                            result.message
                            ||
                            result.error
                            ||
                            "Shipment update failed. HTTP status: "
                            +
                            response.status

                        );

                    }


                    // =================================
                    // SUCCESS
                    // =================================

                    message.className =
                        "message success-message";


                    message.textContent =
                        "Shipment updated successfully!";


                    message.style.display =
                        "block";


                    setTimeout(
                        function() {

                            window.location.href =
                                "shipments.html";

                        },
                        1200
                    );


                }

                catch (error) {


                    console.error(
                        "Update shipment error:",
                        error
                    );


                    message.className =
                        "message error-message";


                    message.textContent =
                        error.message
                        ||
                        "Unable to update shipment.";


                    message.style.display =
                        "block";


                    updateButton.disabled =
                        false;


                    updateButton.textContent =
                        "Update Shipment";

                }

            }
        );


    // =========================================
    // BACK
    // =========================================

    function goBack() {

        window.location.href =
            "shipments.html";

    }


    // =========================================
    // START
    // =========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadShipment();

        }
    );


</script>


</body>

</html>
